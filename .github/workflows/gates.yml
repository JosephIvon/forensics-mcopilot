name: gates

# 本仓的"CI 必须绿"不是口号：门禁 G1–G12 与 pytest 都在这里跑。
# 门禁需要 Windows（csc / .NET Framework 4.8 / PowerShell 5.1 兼容面），
# 所以 runner 固定 windows-latest —— 换 Linux 跑等于换一套被测环境，绿了也不能算数。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 一条命令打印两行：这**不是**为了少打字，而是为了让这条 step 只有
      # 一个退出码来源。多命令块里除最后一条外的失败会被 Actions 吞掉（见下文 P0-1 的注释）。
      - name: 环境自述（版本与解释器路径）
        run: python -c "import sys; print(sys.version); print('exe:', sys.executable)"

      # setup-python 装的是**干净解释器**，里面没有 pytest —— 不装它，
      # 后面那步会直接 "No module named pytest" 退 1（2026-10-24 实测踩过）。
      #
      # pypdf 也要装：它是 scripts/check_modbus_quotes.py（门禁 G5 的引文反查）
      # 与 scripts/extract_slmp.py 的**硬依赖**。不装的话：有仓外原件的机器上
      # 会 ModuleNotFoundError 硬失败，CI 上则永远 SKIP——这条「引文是不是编的」
      # 验证两头都没跑过。（2026-10-25 评审发现：它既不在 pyproject 的任何 extra 里，
      #  也不在本安装清单里。）
      # 只装 pytest、matplotlib 与 pypdf，**不装本包**（`pip install -e .` 也不行）：
      # 本仓的布局契约要求"从仓库根直接 import mcopilot 应当不成立"，
      # 而可编辑安装会让它成立 → tests/test_layout_contract.py 立刻变红。
      # 跑测试靠 pytest 配置里的 pythonpath = ["src"]，不靠装包。
      # 运行时代码仍是**零三方依赖**；这两个是测试期依赖
      # （pyproject 的 dev / charts 两个 extra）。
      # matplotlib 也要装：它是**可选**依赖（缺它时按设计降级为"不画图但报告照出"），
      # 但 CI 必须真的走一遍画图路径——不然画图坏了没人知道。
      - name: 装测试期依赖（pytest + matplotlib；不装本包）
        run: python -m pip install --disable-pip-version-check --upgrade "pytest>=7" "matplotlib>=3.5" "pypdf>=4"

      - name: pytest 全量
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q

      - name: 文档与电子书同步门禁（双语 / 行号引用 / 书锚点 / 裁剪件 / 结构 / 书里的数字）
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 这六条是**各自独立**的门禁，每条都必须自己判退出码。
          #
          # （2026-10-25 实测踩过的坑：把它们串在一个 pwsh 块里，GitHub Actions
          #  只把**最后一条**命令的 $LASTEXITCODE 带出 step——
          #  第 1 条 exit 3、第 4 条 exit 7，step 照样 exit 0。
          #  也就是说这条 step 曾经吞掉 6 条门禁里 5 条的失败信号：
          #  README 中英不同步、文档行号引用失效、书锚点断链、裁剪件被改、
          #  书结构违规、书里的数字对不上——任意一类发生，CI 全绿。
          #  $ErrorActionPreference 管不了 native command，$PSNativeCommandUseErrorActionPreference
          #  默认 $false，所以只能自己逐条判。）
          $failed = @()
          foreach ($s in @(
            "scripts/verify_bilingual_parity.py",
            "scripts/verify_doc_refs.py",
            "book/tools/check_doc_refs_heads.py",
            "book/tools/verify_crops_verbatim.py",
            "book/tools/check_vol2s_structure.py",
            "book/tools/verify_book_numbers.py")) {
            Write-Output "--- $s"
            python $s
            if ($LASTEXITCODE -ne 0) { $failed += "$s (exit $LASTEXITCODE)" }
          }
          if ($failed.Count -gt 0) {
            Write-Output "::error::文档与电子书同步门禁有 $($failed.Count) 条失败："
            $failed | ForEach-Object { Write-Output "::error::  $_" }
            exit 1
          }
          Write-Output "文档与电子书同步门禁 6 条全过 ✓"

      - name: 公开前脱敏门禁（家目录/用户名与本机工作区路径必须是 0）
        env:
          PYTHONIOENCODING: utf-8
        run: python book/tools/scan_absolute_paths.py

      - name: 门禁 G1–G12（编译 / 黄金帧 / 契约 / quote 反查 / 锚点 / 文档一致性 / 接入 / 农场 / 语料）
        shell: pwsh
        run: ./scripts/gate_protocol.ps1

      - name: 真实语料门禁（Lemay 夹具逐行断言 + 负向三重）
        shell: pwsh
        run: ./scripts/gate_corpus.ps1

      # 这一步**故意不设** PYTHONIOENCODING：runner 的控制台是 cp1252，
      # 让脚本自己面对这件事（脚本里已按本仓惯例 reconfigure stdout 为 UTF-8）。
      # 设上环境变量反而会把"脚本扛不住非 UTF-8 控制台"这类问题**藏起来**。
      - name: 外部真值锚点门禁（sha256 + 再提取抽查；仓外原件不在位记 SKIP）
        run: python scripts/gate_anchors.py

      - name: 文档一致性门禁（文档里的数字全部实算）
        shell: pwsh
        run: ./scripts/gate_docsync.ps1

      - name: 负向门禁（每个注入都要让对应门变红）
        shell: pwsh
        run: ./scripts/gate_negative.ps1

      - name: 故障注入农场（批产→检出→判卷→矩阵）
        shell: pwsh
        run: ./scripts/gate_farm.ps1

      - name: 接入闭环（三场景：全绿 / 已知归因 / 未知升级）
        shell: pwsh
        run: ./scripts/gate_onboard.ps1
